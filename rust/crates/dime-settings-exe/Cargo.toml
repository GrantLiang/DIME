[package]
name = "dime-settings-exe"
description = "DIMESettings.exe built by cargo (phase 5b-15f): wWinMain in Rust over dime-ffi's settings app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "DIMESettings"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
dime-ffi = { path = "../dime-ffi" }
